# Welcome to Jekyll!
# 
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Maginve
email: admin@maginve.com
description: >
  A collection of high-quality HD, Full HD, and 4K wallpapers featuring nature landscapes, mountains, forests, beaches, sunsets, city views, and aesthetic designs.

url: "https://maginvee.github.io"
baseurl: "/"

timezone: Asia/Jakarta

future: false

default-image: logo.jpg
logo: logo.jpg

built-by: Maginve

copyright:
  name: Maginve
  link: "https://maginvee.github.io"

markdown: kramdown
permalink: /:title/

paginate: 6
paginate_path: /page:num/

include:
  - _pages

sass:
  style: compressed

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap