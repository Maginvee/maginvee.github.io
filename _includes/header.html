<header class="bg-white my-3">

  <!-- TOP MENU -->
  <div class="border-bottom border-3 border-light">
    <div class="container">

      <ul class="nav small text-uppercase fw-bold gap-3">
        <li class="nav-item small">
          <a class="nav-link px-0 text-secondary" href="/">Home</a>
        </li>

        <li class="nav-item small">
          <a class="nav-link px-0 text-secondary" href="/about/">
            About
          </a>
        </li>

        <li class="nav-item small">
          <a class="nav-link px-0 text-secondary" href="/privacy/">
            Privacy
          </a>
        </li>

        <li class="nav-item small">
          <a class="nav-link px-0 text-secondary" href="/contact/">
            Contact
          </a>
        </li>

        <li class="nav-item small">
          <a class="nav-link px-0 text-secondary" href="/sitemap.xml">
            Sitemap
          </a>
        </li>
      </ul>

    </div>
  </div>

  <!-- LOGO -->
  <div class="container py-4">
    <a href="/" class="text-decoration-none">
      <h2 class="text-danger fw-bold text-uppercase m-0">
        {{ site.title }}
      </h2>
    </a>
  </div>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-danger border-3 py-0">

    <div class="container">

      <!-- MOBILE BUTTON -->
      <button class="navbar-toggler border-0 shadow-none"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar">

        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- MENU -->
      <div class="collapse navbar-collapse" id="mainNavbar">

        <ul class="navbar-nav me-auto text-uppercase fw-bold small">

          <li class="nav-item border border-danger">
            <a class="nav-link text-white active bg-danger px-3" href="/">
              Home
            </a>
          </li>

          <li class="nav-item border border-dark">
            <a class="nav-link text-white px-3" href="/categories/abstract/">
              Abstract
            </a>
          </li>

          <li class="nav-item border border-dark">
            <a class="nav-link text-white px-3" href="/categories/aesthetic/">
              Aesthetic
            </a>
          </li>

          <li class="nav-item border border-dark">
            <a class="nav-link text-white px-3" href="/categories/background/">
              Background
            </a>
          </li>

          <li class="nav-item border border-dark">
            <a class="nav-link text-white px-3" href="/categories/landscape/">
              Landscape
            </a>
          </li>

          <li class="nav-item border border-dark">
            <a class="nav-link text-white px-3" href="/categories/nature/">
              Nature
            </a>
          </li>

          <li class="nav-item border border-dark">
            <a class="nav-link text-white px-3" href="/categories/wallpaper/">
              Wallpaper
            </a>
          </li>

        </ul>

        <!-- SEARCH -->
        <form class="d-flex" action="/search/" method="get">

          <input class="form-control rounded-0 border-0"
            type="search"
            name="q"
            placeholder="SEARCH...">

          <button class="btn btn-danger rounded-0 px-3" type="submit">
            <i class="fa fa-search"></i>
          </button>

        </form>

      </div>

    </div>

  </nav>

</header>
