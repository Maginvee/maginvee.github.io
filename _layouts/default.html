  {% include analytics.html %}

  <!-- AD -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const ads = document.querySelectorAll(".adsterra-ad");
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const adBox = entry.target;
            if (!adBox.dataset.loaded) {
              window.atOptions = {
                key: '07077f5796a85a0674c4d4cd2c86d31b',
                format: 'iframe',
                height: 250,
                width: 300,
                params: {}
              };
              const s = document.createElement('script');
              s.src = 'https://deeperregardingcontend.com/07077f5796a85a0674c4d4cd2c86d31b/invoke.js';
              s.async = true;
              adBox.appendChild(s);
              adBox.dataset.loaded = "true";
            }
          }
        });
      }, {
        rootMargin: "200px"
      });
      ads.forEach(ad => observer.observe(ad));
    });
  </script>
</body>

</html>
